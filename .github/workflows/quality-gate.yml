name: APN Standard Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject unresolved merge markers
        run: |
          set -euo pipefail
          if git grep -I -n -E '^(<<<<<<<|=======|>>>>>>>)( |$)' -- .; then
            echo "Unresolved merge marker detected."
            exit 1
          fi

      - name: Select runtime and package manager
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '"node"[[:space:]]*:[[:space:]]*"24' package.json; then
            echo "node=24" >> "$GITHUB_OUTPUT"
          else
            echo "node=22" >> "$GITHUB_OUTPUT"
          fi
          if [[ -f pnpm-lock.yaml ]]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [[ -f package-lock.json ]]; then
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          else
            echo "No supported committed lockfile found."
            exit 1
          fi

      - name: Set up pnpm
        if: steps.runtime.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.runtime.outputs.node }}

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.runtime.outputs.pm }}" == "pnpm" ]]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Run repository checks
        shell: bash
        env:
          PM: ${{ steps.runtime.outputs.pm }}
        run: |
          set -euo pipefail
          has_script() {
            node -e 'const p=require("./package.json"); process.exit(p.scripts && p.scripts[process.argv[1]] ? 0 : 1)' "$1"
          }
          run_script() {
            if has_script "$1"; then
              "$PM" run "$1"
            fi
          }
          run_script lint
          run_script typecheck
          run_script test
          run_script build
          run_script verify:cloudflare

      - name: Audit production dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.runtime.outputs.pm }}" == "pnpm" ]]; then
            pnpm audit --prod --audit-level high
          else
            npm audit --omit=dev --audit-level=high
          fi

      - name: Audit all dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.runtime.outputs.pm }}" == "pnpm" ]]; then
            pnpm audit --audit-level high
          else
            npm audit --audit-level=high
          fi
