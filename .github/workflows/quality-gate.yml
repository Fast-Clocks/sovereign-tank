name: APN Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate lockfile from committed dependency policy
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Install regenerated locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Production build
        run: pnpm run build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Audit all dependencies
        run: pnpm audit --audit-level high

      - name: Commit verified lockfile only
        if: github.event_name == 'pull_request' && github.head_ref == 'claude/security-and-quality-gate' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
          EXPECTED_LOCK_SHA: f85eb26d50570161172472b6bc9c6ef6147403fd
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${REPO}/contents/pnpm-lock.yaml?ref=${BRANCH}" --jq .sha)"
          test "$current_sha" = "$EXPECTED_LOCK_SHA"
          content="$(base64 -w0 pnpm-lock.yaml)"
          gh api --method PUT "repos/${REPO}/contents/pnpm-lock.yaml" \
            -f message='security: commit verified consolidated lockfile' \
            -f content="$content" \
            -f sha="$current_sha" \
            -f branch="$BRANCH" >/dev/null
