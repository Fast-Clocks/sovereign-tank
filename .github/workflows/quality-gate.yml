name: APN Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: claude/security-and-quality-gate

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Generate patched dependency graph
        run: pnpm update next@16.3.3 eslint-config-next@16.3.3 browserslist@4.28.7 sharp@0.35.4 --save-exact --lockfile-only

      - name: Verify repair changed only dependency manifests
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(package.json|pnpm-lock.yaml)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed paths:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit dependency repair if required
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "Dependency graph already repaired."
            exit 0
          fi
          git config user.name "APN Security Gate"
          git config user.email "288131154+Fast-Clocks@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "security: patch audited dependency graph"
          git push origin HEAD:claude/security-and-quality-gate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Production build
        run: pnpm run build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Audit all dependencies
        run: pnpm audit --audit-level high
